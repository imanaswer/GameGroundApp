# Flow 4/5 (§14): profile edit.
#
# Also covers the WhatsApp-number requirement audit #25 added — game creation now demands a
# phone on the profile, so this screen became load-bearing for a second flow.
appId: net.gameground.app.preview
name: 04 profile edit
---
- runFlow: subflows/login.yaml

- tapOn: "Home"
- tapOn:
    id: "profile"              # calibrate: the header avatar has no testID; use studio
    optional: true
- tapOn:
    text: "Profile"
    optional: true

- extendedWaitUntil:
    visible: "Edit"
    timeout: 15000
- tapOn: "Edit"

- assertVisible: "Your full name"

# Write a value we can assert on afterwards. Timestamped so a rerun cannot pass on stale state.
- tapOn: "Your full name"
- eraseText
- inputText: "E2E ${maestro.rand}"
- tapOn: "Favourite courts, the teams you follow…"
- eraseText
- inputText: "Edited by Maestro"
- hideKeyboard

- tapOn: "Save"                # calibrate: exact save CTA copy

- extendedWaitUntil:
    visible: "Saved|Profile updated"
    timeout: 20000

# Round-trip: leave the screen and come back, so we assert the server's value and not
# an optimistic cache write.
- back
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Edited by Maestro"
    timeout: 15000
