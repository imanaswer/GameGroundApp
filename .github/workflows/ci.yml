name: CI

on:
  pull_request:
  push:
    # Every branch. The old `[main, "m[0-9]*"]` list matched the milestone naming
    # convention only, so work on a differently-named branch (design-excellence-v2)
    # was never checked anywhere but a laptop. Gates are ~1 min; run them everywhere.
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # S1.5 release gate (Developer PRD §2.4). Exports the real bundle and greps it for
  # live keys / secrets. Slower than the unit gates, so it runs only where a release
  # can actually be cut from, not on every feature push.
  secret-grep:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle secret-grep
        # EXPO_PUBLIC_API_URL is required at import time by src/lib/env.ts, so the
        # export needs it set. It is a public value, not a secret.
        env:
          EXPO_PUBLIC_API_URL: https://www.gameground.net
        run: bash scripts/release-check.sh
